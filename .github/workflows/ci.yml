name: CI

# Feature branches are verified in their pull request, while `main` is verified
# after a merge or a direct maintenance push. Keeping feature-branch pushes out
# of this trigger avoids running the same commit twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless; cancelling it
# keeps the free-tier minutes for runs anyone still cares about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # docs/tech-stack.md's gates run as separate steps in one job rather than separate
  # jobs: each gate is still named and still fails the run on its own, but they
  # share one checkout and one install, which is what keeps a run cheap.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a major tag, preferring one that has had months of
      # patch releases behind it over the newest major. checkout and setup-node
      # sit one major behind their latest; pnpm/action-setup v6 is its latest.
      - name: Checkout
        uses: actions/checkout@v6

      # Before setup-node, so its `cache: pnpm` can find the pnpm store. The
      # pnpm version comes from the root package.json's `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          # Local dev runs Node 24; package.json accepts the Expo/RNTL floor
          # `^22.13.0 || >=24.0.0`.
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository workflow
        run: pnpm validate:workflow

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unit and integration are split so a red run names the layer that broke:
      # pure TypeScript (packages/*) versus Convex functions on convex-test's
      # in-memory backend. The Convex run needs no deployment and no secrets —
      # it runs off the committed `convex/convex/_generated` files.
      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Rendered app tests
        run: pnpm test:render

      # Question Packs are hand-written data files, so nothing about them is
      # typechecked: this is the gate that keeps a malformed one — three
      # options, an answer index pointing nowhere — out of the repo.
      - name: Validate packs
        run: pnpm validate:packs

      # A source seam can miss a bundler-only edge. Export both client graphs
      # and scan the actual Hermes output for curated question text and the
      # serialized pack; this is the production proof described in F-011.
      - name: Export and inspect client bundle seams
        run: |
          controller_export="$(mktemp -d)"
          tv_export="$(mktemp -d)"
          pnpm --filter @huddle/controller exec expo export --platform ios --output-dir "$controller_export"
          pnpm --filter @huddle/tv exec expo export --platform ios --output-dir "$tv_export"
          pnpm verify:bundle-seam -- "$controller_export"
          pnpm verify:bundle-seam -- "$tv_export"

      - name: Inspect Android TV prebuild metadata
        run: pnpm --filter @huddle/tv prebuild --platform android --no-install

  # The Node floor is an intentional compatibility contract, not just the
  # developer machine version. Keep a focused 22.13 gate beside the complete
  # Node 24 suite so an engine/type regression cannot hide behind a newer
  # runtime.
  node-22-compat:
    name: Node 22.13 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node 22.13
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck on the supported floor
        run: pnpm typecheck
      - name: Run pure and backend tests on the supported floor
        run: pnpm test:unit && pnpm test:integration
