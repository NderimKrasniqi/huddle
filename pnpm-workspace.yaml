  - convex
  - packages/*
  - games/*

catalog:
  '@types/node': ^22.13.0
  '@types/react': ~19.2.17
  typescript: ~5.9.3
  zod: ^4.4.3

auditConfig:
  ignoreCves:
    - CVE-2025-71329
    - CVE-2025-71330

overrides:
  brace-expansion@>=4.0.0 <5.0.9: 5.0.9
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  nanoid@<3.3.17: 3.3.18
  react-native-worklets: 0.10.1
  uuid@<11.1.1: 11.1.1

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch

# Skia copies its prebuilt native libraries into place on install.
onlyBuiltDependencies:
  - "@shopify/react-native-skia"
