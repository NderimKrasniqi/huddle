# cargo deny check: advisories, licenses, banned crates and sources for the relay.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check; unmaintained crates are reported too.
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.9
# The relay itself is unpublished.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
