appId: tv.huddle.phone
---
- runFlow:
    when:
      visible: Join a room
    commands:
      - tapOn: Join a room
- openLink: huddle://join/${CODE}
- extendedWaitUntil:
    visible:
      id: identity-screen|identity-room-handoff
    timeout: 20000
- runFlow:
    when:
      visible:
        id: identity-room-handoff
    commands:
      - extendedWaitUntil:
          visible:
            id: identity-handoff-room-available
          timeout: 20000
      - tapOn:
          id: identity-confirm-handoff
- extendedWaitUntil:
    visible:
      id: identity-join
    timeout: 20000
- tapOn:
    id: identity-join
- extendedWaitUntil:
    visible:
      id: phone-lobby
    timeout: 30000
- assertVisible: Ana is the host and picks the games.
- openLink: huddle://join/${CODE2}
- extendedWaitUntil:
    visible:
      id: identity-room-handoff
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: identity-handoff-room-available
    timeout: 20000
- tapOn:
    id: identity-confirm-handoff
- extendedWaitUntil:
    visible:
      id: identity-join
    timeout: 20000
- tapOn:
    id: identity-join
- extendedWaitUntil:
    visible:
      id: phone-lobby
    timeout: 30000
- assertVisible: Room ${CODE2}
- assertVisible: Bea is the host and picks the games.
